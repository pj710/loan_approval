# Main configuration for loan approval project

project:
  name: Loan Approval ML System
  author: Josiah Gordor
  version: 1.0
  description: >
    AI-powered mortgage underwriting assistant using HMDA data.

paths:
  data_raw: data/raw/5493001WHVQBGRSWEU75_header.txt
  data_delimiter: "|"
  data_processed: data/processed/
  models: models/
  reports: reports/
  results: results/

data_validation:
  required_columns:
    - activity_year
    - loan_amount
    - action_taken
    - state_code
    - debt_to_income_ratio
    - combined_loan_to_value_ratio

api:
  host: 0.0.0.0
  port: 8000
  debug: true
  docs_url: /docs

model:
  type: xgboost
  random_seed: 42
  test_size: 0.15
  val_size: 0.15
  features:
    - income
    - loan_amount
    - property_value
    - debt_to_income_ratio
    - combined_loan_to_value_ratio
    - interest_rate
    - loan_term
    - loan_type
    - occupancy_type
    - state_code
    - applicant_age
  target: target

preprocessing:
  numeric_columns:
    - income
    - loan_amount
    - property_value
    - interest_rate
    - loan_term
    - debt_to_income_ratio
    - combined_loan_to_value_ratio

target_mapping:
  action_taken_column: action_taken
  approved_codes: ["1", "2"]
  denied_codes: ["3"]

fairness:
  metrics:
    - demographic_parity_difference
    - equalized_odds_difference
    - disparate_impact
  protected_attributes:
    - applicant_race_1
    - applicant_ethnicity_1
    - applicant_sex
    - applicant_age

explainability:
  method: shap
  top_features: 10
